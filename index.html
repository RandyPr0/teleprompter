<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter por voz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0b0b0d;--fg:#f3f1ec;--dim:#5c5a55;--done:#8d8a83;--accent:#ff2d55;--ui:#17171b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(var(--bg) 70%,transparent)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ui);color:var(--fg);font-size:15px}
button:focus-visible{outline:2px solid var(--accent)}
#start{background:var(--accent);color:#fff;font-weight:700;flex:1}
#start.on{background:#2a2a30}
#status{font-size:12px;color:var(--dim);margin-left:auto;white-space:nowrap}
#stage{position:absolute;inset:0;overflow-y:auto;padding:45vh max(20px,env(safe-area-inset-right,0px)) 60vh max(20px,env(safe-area-inset-left,0px));scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#text{font-size:var(--size,44px);line-height:1.35;font-weight:600;text-wrap:pretty}
#text span{color:var(--dim);transition:color .15s}
#text span.done{color:var(--done)}
#text span.cur{color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:4px;text-underline-offset:6px}
#text span.next{color:var(--fg)}
#text .p{display:block;height:.6em}
#line{position:fixed;left:0;right:0;top:45vh;height:2px;background:var(--accent);opacity:.35;pointer-events:none;z-index:4}
#edit{position:fixed;inset:0;z-index:6;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#edit[hidden]{display:none}
textarea{flex:1;width:100%;background:var(--ui);color:var(--fg);border:1px solid #2a2a30;border-radius:12px;padding:12px;font:16px/1.5 system-ui,sans-serif;resize:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mirror #text{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){#stage{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar">
  <button id="start">Empezar</button>
  <button id="minus" aria-label="Letra más chica">A−</button>
  <button id="plus" aria-label="Letra más grande">A+</button>
  <button id="mirror" aria-label="Espejo">⇋</button>
  <button id="editBtn">Guion</button>
  <span id="status">listo</span>
</div>
<div id="line"></div>
<div id="stage"><div id="text"></div></div>

<div id="edit" hidden>
  <strong>Pega o corrige el guion</strong>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="row"><button id="save" style="background:var(--accent);color:#fff;font-weight:700">Listo</button><button id="reset">Volver al guion de Vibras</button></div>
</div>

<script>
const GUION = `Mírame ahí. En el aire. Ya salté y todavía no sé dónde caigo. Esa es la foto más honesta de mi vida ahora mismo.

Te voy a contar en un minuto por qué me tiré así, sin red. Quédate, porque al final te digo cómo termina esto.

Hace un tiempo me estaba llevando el diablo. Económicamente no estaba bien, y me fui a Montana a trabajar en paneles solares, turnos de diez horas, lejos de mi esposa, solo por el dinero. Y aun así nunca solté esto. Porque yo no vine a este país a sobrevivir. Vine a hacer lo mío.

Pero eso no fue lo más duro.

Lo más duro es esto. El 6 de noviembre sale Vibras, y por primera vez en mi vida estoy invirtiendo en mi carrera, después de años preparándome. Esta carrera es difícil: hay que meterle dinero, dinero que a veces hace falta para vivir en este país. Y uno decide apostarlo en lo que ama hacer. No hay plan B.

Y lo loco es que lo que me está salvando no es lo que yo pensaba.

Yo creía que necesitaba el video perfecto: la piscina, la edición. Y el video que más gente me trajo fue yo sentado en una silla con un gorro diciendo la verdad. Mi esposa y mucha gente me han preguntado: ¿hasta cuándo vas a hacer esto? Y yo siempre respondo lo mismo: hasta que me muera.

Si llegaste hasta aquí, eres de los que de verdad importan. El viernes caigo al agua, bien o mal, pero caigo. Comenta VIBRAS y te mando el link por privado para que lo veas antes que nadie.`;

const $ = id => document.getElementById(id);
const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ]/g,'');
const NUM = {'6':'seis','10':'diez','600':'seiscientos'};
let words = [], spans = [], pos = 0, rec = null, running = false, size = 44;

function load(){ try{ return localStorage.getItem('guion') || GUION }catch(e){ return GUION } }
function render(txt){
  const t = $('text'); t.innerHTML = ''; words = []; spans = []; pos = 0;
  txt.split(/\n\s*\n/).forEach((para,i)=>{
    if(i){ const p=document.createElement('span'); p.className='p'; t.appendChild(p); }
    para.split(/\s+/).filter(Boolean).forEach(w=>{
      const s=document.createElement('span'); s.textContent=w+' '; t.appendChild(s);
      const n = norm(NUM[w.replace(/[^\d]/g,'')] && /^\d+[.,]?$/.test(w) ? NUM[w.replace(/[^\d]/g,'')] : w);
      if(n){ words.push(n); spans.push(s); }
    });
  });
  mark();
}
function mark(){
  spans.forEach((s,i)=>{ s.className = i<pos?'done': i===pos?'cur': i<pos+6?'next':''; });
  const s = spans[Math.min(pos, spans.length-1)];
  if(s){ const st=$('stage'); st.scrollTo({top: s.offsetTop - st.clientHeight*0.45}); }
}
function sim(a,b){ if(a===b) return 1; if(a.length>3 && b.length>3 && (a.startsWith(b)||b.startsWith(a))) return .8; return 0; }
function follow(transcript){
  const said = transcript.split(/\s+/).map(norm).filter(Boolean).slice(-4);
  if(!said.length) return;
  let best=-1, bestScore=0;
  const win = 14;
  for(let i=Math.max(0,pos-2); i<Math.min(words.length, pos+win); i++){
    // score: how many of the last said words match ending at i
    let score=0, k=i;
    for(let j=said.length-1;j>=0 && k>=0;j--,k--){ score += sim(words[k], said[j]); }
    score -= (i-pos)*0.03;
    if(score>bestScore){ bestScore=score; best=i; }
  }
  if(best>=0 && bestScore>=0.8){ pos = best+1; mark(); }
}
function start(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $('status').textContent='este navegador no tiene voz: usa Chrome'; return; }
  rec = new SR(); rec.lang='es-US'; rec.continuous=true; rec.interimResults=true;
  rec.onresult = e => { const r=e.results[e.results.length-1]; follow(r[0].transcript); $('status').textContent = r.isFinal?'●':'…'; };
  rec.onerror = e => { $('status').textContent = e.error==='not-allowed' ? 'permite el micrófono' : e.error; };
  rec.onend = () => { if(running) try{ rec.start() }catch(e){} };
  rec.start(); running=true; $('start').textContent='Parar'; $('start').classList.add('on'); $('status').textContent='escuchando';
  if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
}
function stop(){ running=false; if(rec){ rec.onend=null; rec.stop(); } $('start').textContent='Empezar'; $('start').classList.remove('on'); $('status').textContent='parado'; }

$('start').onclick = () => running ? stop() : start();
$('plus').onclick = () => { size=Math.min(90,size+6); document.documentElement.style.setProperty('--size',size+'px'); mark(); };
$('minus').onclick = () => { size=Math.max(24,size-6); document.documentElement.style.setProperty('--size',size+'px'); mark(); };
$('mirror').onclick = () => document.body.classList.toggle('mirror');
$('editBtn').onclick = () => { stop(); $('src').value = load(); $('edit').hidden=false; };
$('save').onclick = () => { const v=$('src').value.trim(); try{ localStorage.setItem('guion',v) }catch(e){} $('edit').hidden=true; render(v); };
$('reset').onclick = () => { $('src').value = GUION; };
$('text').onclick = e => { const i=spans.indexOf(e.target); if(i>=0){ pos=i; mark(); } };
render(load());
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
